<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZ Designer | Diseñador gráfico</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Google Fonts: Archivo Black for headings, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="#home" aria-label="CZ Designer, inicio">
                <img src="assets/images/CZ-NEGRO-1080x1080.png" alt="CZ Designer">
            </a>
            <ul class="nav-links" id="primary-navigation">
                <li><a href="#home">Home</a></li>
                <li><a href="#sobre-mi">Acerca de mí</a></li>
                <li><a href="#proyectos">Proyectos</a></li>
                <li><a href="#contact">Contacto</a></li>
            </ul>
            <button class="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="primary-navigation">
                <span class="line1"></span>
                <span class="line2"></span>
                <span class="line3"></span>
            </button>
        </nav>
    </header>

    <main id="main-content">
        <div data-component="hero"></div>
        <div data-component="about"></div>
        <div data-component="projects"></div>
        <div data-component="contact"></div>
    </main>

    <script type="module" src="js/main.js"></script>

</html>
